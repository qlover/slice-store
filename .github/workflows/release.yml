name: Release sub packages

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - closed
    paths:
      - packages/**

concurrency:
  group: release-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # PR merged to main with preRelease (non-release head) -> version bump + create release PR
  create-release-pr:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.merged == true &&
        github.event.pull_request.base.ref == 'main' &&
        !startsWith(github.event.pull_request.head.ref, 'release/') &&
        contains(github.event.pull_request.labels.*.name, 'preRelease')
      )
    runs-on: ubuntu-latest
    env:
      NX_DAEMON: 'false'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Config Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'

      - run: npm install -g pnpm@10
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm test
      - run: pnpm nx:build:force
      - run: pnpm rebuild

      - name: Create release PR to main
        if: github.event_name == 'pull_request'
        run: |
          INCREMENT=patch
          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'increment:major') }}" == "true" ]]; then
            INCREMENT=major
          elif [[ "${{ contains(github.event.pull_request.labels.*.name, 'increment:minor') }}" == "true" ]]; then
            INCREMENT=minor
          fi
          echo "Using version increment: $INCREMENT"
          npx fe-release -V \
            -s main \
            -i "$INCREMENT" \
            --workspaces.compare-ref "${{ github.event.pull_request.base.sha }}" \
            --changesetVersion.ignore-non-updated-packages
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          FE_RELEASE_BRANCH: main

      - name: Create release PR to main (manual)
        if: github.event_name == 'workflow_dispatch'
        run: |
          npx fe-release -V \
            -s main \
            --changesetVersion.ignore-non-updated-packages
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          FE_RELEASE_BRANCH: main

  # release/* PR merged to main with CI-Release -> publish to npm and GitHub
  publish:
    if: |
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'release/') &&
      contains(github.event.pull_request.labels.*.name, 'CI-Release')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Required for npm Trusted Publishing (OIDC)
      id-token: write
    env:
      NX_DAEMON: 'false'

    steps:
      # PAT is required: default GITHUB_TOKEN from pull_request may not push tags
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.PAT_TOKEN }}

      - name: Config Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'

      - run: npm install -g pnpm@10

      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@11.15.0

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm test
      - run: pnpm nx:build:force
      - run: pnpm rebuild

      - name: Create tag and publish
        run: |
          npx fe-release -V \
            --workspaces.compare-ref "${{ github.event.pull_request.base.sha }}" \
            --changesetVersion.skip-changeset \
            --changesetVersion.mode publish \
            --changesetVersion.use-trusted-publishing \
            --github.mode createRelease \
            --github.ignore-release-paths examples
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          FE_RELEASE_BRANCH: main
